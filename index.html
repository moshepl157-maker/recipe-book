<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="description" content="ספר המתכונים האישי שלי - ייבוא וארגון מתכונים">
  <title>ספר המתכונים שלי</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <h1 id="page-title">המתכונים שלי</h1>
      <button id="btn-settings" class="icon-btn" title="הגדרות">⚙️</button>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
      <!-- Screens will be injected here -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="home">
        <span class="nav-icon">📖</span>
        <span class="nav-label">מתכונים</span>
      </button>
      <button class="nav-btn" data-screen="import">
        <span class="nav-icon">➕</span>
        <span class="nav-label">ייבוא</span>
      </button>
      <button class="nav-btn" data-screen="categories">
        <span class="nav-icon">📁</span>
        <span class="nav-label">קטגוריות</span>
      </button>
    </nav>
  </div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
